# Trust the scheme set by an upstream TLS terminator; fall back to our own.
map $http_x_forwarded_proto $fwd_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Larger than MAX_UPLOAD_MB (backend enforces the real limit).
    client_max_body_size 10m;

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    # API + health go to the backend container (same origin => HttpOnly cookies are same-site).
    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
        proxy_read_timeout 180s;   # AI generation can be slow
    }
    location = /health {
        proxy_pass http://api:8000;
    }

    # Hashed build assets: cache hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
